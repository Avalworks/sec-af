name: Python

# Convención Avalworks: PR a dev = liviano (lint + tests unitarios, 1 versión);
# push a dev no corre; drafts no corren salvo etiqueta `ci`.
on:
  pull_request:
    branches: ["dev", "main"]
    paths: ["src/**", "tests/**", "pyproject.toml", ".github/workflows/python.yml"]
  push:
    branches: ["main"]
    paths: ["src/**", "tests/**", "pyproject.toml"]

concurrency:
  group: py-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft || contains(github.event.pull_request.labels.*.name, 'ci')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]" || pip install -e . pytest pytest-asyncio
      - run: pytest -q --deselect tests/test_scoring.py
