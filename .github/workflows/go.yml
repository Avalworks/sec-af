name: Go

# Convención Avalworks: se trabaja en dev; la suite Go solo corre hacia main.
on:
  push:
    branches: ["main"]
    paths: ["go/**", ".github/workflows/go.yml"]
  pull_request:
    branches: ["main"]
    paths: ["go/**", ".github/workflows/go.yml"]

concurrency:
  group: go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: build / vet / test / gofmt
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
      - name: gofmt
        run: test -z "$(gofmt -l .)"
